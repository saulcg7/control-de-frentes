<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Control de Frentes</title>
  <meta name="description" content="Seguimiento personal de proyectos, solicitudes y recordatorios.">
  <meta name="theme-color" content="#0f1f36">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Frentes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #0f1f36; overflow: hidden; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #eef3f8; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: #0f1f36; color: #edf5fd; font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      transition: opacity .35s; z-index: 2; text-align: center; padding: 24px; }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash img { width: 112px; height: 112px; border-radius: 24px; }
    .bar { width: 160px; height: 3px; background: #1a2f4f; border-radius: 2px; overflow: hidden; }
    .bar::after { content: ''; display: block; width: 40%; height: 100%; background: #31c7df; animation: run 1.1s ease-in-out infinite; }
    @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    #help { display: none; max-width: 380px; color: #b9cde0; font-size: 13px; }
    #help a { color: #31c7df; }
    .setup { color: #edf5fd; max-width: 460px; }
    #open { display: none; position: fixed; left: 10px; bottom: 10px; z-index: 3; width: 30px; height: 30px; border-radius: 50%;
      align-items: center; justify-content: center; text-decoration: none; font: 16px sans-serif;
      background: rgba(15,31,54,.75); color: #31c7df; opacity: .55; }
    #open:hover { opacity: 1; }
    .go { background: #31c7df; color: #0f1f36; font-weight: 700; padding: 10px 18px; border-radius: 10px; text-decoration: none; }
    .setup.small { font-size: 13px; color: #b9cde0; }
    .setup code { background: #1a2f4f; padding: 2px 6px; border-radius: 4px; color: #31c7df; }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <img src="icon-192.png" alt="">
    <div><b>Control de Frentes</b></div>
    <div class="bar" id="bar"></div>
    <div id="help">¿Tarda demasiado o pide iniciar sesión? <a id="direct" href="#" target="_blank" rel="noopener">Abre la app directamente</a>.
      Si tienes varias cuentas de Google abiertas, usa un perfil con solo tu Gmail.</div>
  </div>
  <iframe id="app" title="Control de Frentes" allow="clipboard-write; clipboard-read"></iframe>
  <!-- Solo en modo marco: si ves un error de Google (400/401), ábrela directo -->
  <a id="open" href="#" target="_blank" rel="noopener" title="¿Error de Google? Abrir la app directamente">↗</a>

  <script>
    /* ====== ÚNICO DATO QUE DEBES CAMBIAR: la URL /exec de tu implementación de Apps Script ====== */
    var APP_URL = 'https://script.google.com/macros/s/AKfycbxdwgNgUspdH_wz64dCD5zlYPw0onCCPzIeI0zPmgMnuQsLmlpZOW_Z28ZRmyUOM7jz/exec';
    /* MODO: 'directo' = abre la app de Google en la ventana instalada (funciona en cualquier navegador).
             'marco'   = la muestra dentro de esta página (requiere cookies de terceros y una sola cuenta).
       También puedes forzarlo en la dirección: ...github.io/control-de-frentes/?modo=marco             */
    var MODO = 'directo';
    /* =========================================================================================== */

    (function () {
      var splash = document.getElementById('splash');
      var frame = document.getElementById('app');
      if (APP_URL.indexOf('PEGA_AQUI') >= 0) {
        document.getElementById('bar').style.display = 'none';
        splash.insertAdjacentHTML('beforeend', '<div class="setup">Falta configurar la dirección de la app.<br>' +
          'Edita <code>index.html</code> y reemplaza <code>APP_URL</code> por tu URL que termina en <code>/exec</code>.</div>');
        return;
      }
      document.getElementById('direct').href = APP_URL;
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
      var q = (location.search.match(/[?&]modo=(marco|directo)/) || [])[1];
      var installed = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
      if ((q || MODO) === 'directo') {
        if (installed) {
          // App instalada: navegación de primer nivel, Google usa tu sesión normal (sin cookies de terceros).
          location.replace(APP_URL);
          return;
        }
        // En el navegador: página de inicio para instalar la app o abrirla.
        document.getElementById('bar').style.display = 'none';
        splash.insertAdjacentHTML('beforeend',
          '<a class="go" href="' + APP_URL + '">Abrir Control de Frentes</a>' +
          '<div class="setup small">Para instalarla con este icono: en Chrome o Edge usa el botón de instalar de la barra de direcciones; ' +
          'en Android, menú ⋮ › Instalar app; en iPhone, Compartir › Agregar a pantalla de inicio.</div>');
        return;
      }
      // Modo marco. La sección (#/portafolio, etc.) no se transmite: la app abre en su dashboard.
      document.getElementById('open').href = APP_URL;
      document.getElementById('open').style.display = 'flex';
      frame.src = APP_URL;
      frame.addEventListener('load', function () {
        splash.classList.add('hide');
        setTimeout(function () { splash.style.display = 'none'; }, 400);
      });
      setTimeout(function () { document.getElementById('help').style.display = 'block'; }, 7000);
    })();
  </script>
</body>
</html>
